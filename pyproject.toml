[project]
name = "dotfiles-scripts"
version = "0"
requires-python = "==3.15.*"
dependencies = ["graphql-core==3.2.12", "tree-sitter==0.27.0", "tree-sitter-bash==0.25.1"]

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = [
    ".github/scripts",
    "home-manager/common/modules/llm-agent/scripts/gh",
    "home-manager/common/cli/claude-code/scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RET", "RUF"]

[tool.mypy]
python_version = "3.14"
files = [
    ".github/scripts",
    "home-manager/common/modules/llm-agent/scripts/gh",
    "home-manager/common/cli/claude-code/scripts",
]
strict = true
