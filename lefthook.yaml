pre-commit:
  parallel: false
  piped: true
  commands:
    01_secrets:
      run: gitleaks protect --staged -v
    02_platform:
      glob: "*.nix"
      run: |
        if grep -nHF 'hostPlatform.isDarwin' {staged_files}; then
          echo 'platform conditionals must use pkgs.stdenv.hostPlatform.isLinux (negate it for the non-Linux case)' >&2
          exit 1
        fi
    03_comments:
      glob: "*.{nix,sh,zsh,py,yml,yaml,toml,pl}"
      run: |
        awk '
          FNR == 1 { run = 0; cont = 0 }
          {
            line = $0
            sub(/^[ \t]+/, "", line)
            comment = 0
            # A shebang is not a comment, and -- only opens a Lua comment when it does not continue a backslashed line
            if (line ~ /^#/ && line !~ /^#!/) { comment = 1; body = substr(line, 2) }
            else if (line ~ /^--/ && !cont) { comment = 1; body = substr(line, 3) }
            cont = ($0 ~ /\\$/)
            if (!comment) { run = 0; next }
            if (body ~ /^[ \t]*$/) { printf "%s:%d:%s\n", FILENAME, FNR, $0; blank = 1; run = 0; next }
            # A commented-out line of code carries no prose, so it never continues a comment
            if (body ~ /=/ || body ~ /;[ \t]*$/) { run = 0; next }
            if (++run > 1) { printf "%s:%d:%s\n", FILENAME, FNR, $0; spans = 1 }
          }
          END {
            if (blank) print "drop comments with no body" > "/dev/stderr"
            if (spans) print "keep each comment on one line" > "/dev/stderr"
            if (blank || spans) exit 1
          }
        ' {staged_files}
    04_format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    05_lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    06_types:
      glob: "*.py"
      run: uv run mypy
    07_nixfmt:
      glob: "*.nix"
      run: nix fmt {staged_files}
      stage_fixed: true
