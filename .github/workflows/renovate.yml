name: Renovate
on:
  schedule:
    - cron: "0 20 * * *"
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: renovate
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Renovate puts this date into each lock file maintenance branch name and PR title for one PR per lock file per day; `branchTopic` cannot do it because grouping replaces it with the group slug.
      - name: Build the dated Renovate config
        run: |
          jq -n --arg date "$(date -u +%Y-%m-%d)" '{
            lockFileMaintenance: {
              additionalBranchPrefix: "\($date)-",
              commitMessageExtra: "(\($date))"
            }
          }' > renovate-dated-config.json
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.167.5
          configurationFile: renovate-dated-config.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
