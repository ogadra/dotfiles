name: Renovate
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: renovate
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Renovate puts this UTC 6-hour slot (YYYY-MM-DD-HH) into each lock file maintenance branch name and PR title for one PR per lock file per slot; `branchTopic` cannot do it because grouping replaces it with the group slug.
      - name: Build the dated Renovate config
        run: |
          # 21600 seconds is 6 hours, matching the cron interval so push and manual runs reuse the current slot
          slot="$(date -u -d "@$(( $(date -u +%s) / 21600 * 21600 ))" +%Y-%m-%d-%H)"
          jq -n --arg date "$slot" '{
            lockFileMaintenance: {
              additionalBranchPrefix: "\($date)-",
              commitMessageExtra: "(\($date))"
            }
          }' > renovate-dated-config.json
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.178.5
          configurationFile: renovate-dated-config.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
