name: Renovate
on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: renovate
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Renovate puts this date into each lock file maintenance branch name and PR title for one PR per lock file per day; `branchTopic` cannot do it because grouping replaces it with the group slug.
      - name: Build the dated Renovate config
        run: |
          jq -n --arg date "$(date -u +%Y-%m-%d)" '{
            lockFileMaintenance: {
              additionalBranchPrefix: "\($date)-",
              commitMessageExtra: "(\($date))"
            }
          }' > renovate-dated-config.json
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.133.0
          configurationFile: renovate-dated-config.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
