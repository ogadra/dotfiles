name: Build
on:
  pull_request:
    paths:
      - "**/*.nix"
      - flake.lock
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: bisharp
            os: ubuntu-latest
          - host: xurkitree
            os: ubuntu-latest
          - host: stakataka
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix build --print-out-paths '.#nixosConfigurations."${{ matrix.host }}".config.system.build.toplevel' --no-link
