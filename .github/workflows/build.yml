name: Build
on:
  pull_request:
    paths:
      - "**/*.nix"
      - flake.lock
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: bisharp
            os: ubuntu-latest
            cfg: nixosConfigurations
          - host: xurkitree
            os: ubuntu-latest
            cfg: nixosConfigurations
          - host: stakataka
            os: macos-latest
            cfg: darwinConfigurations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix build --print-out-paths '.#${{ matrix.cfg }}."${{ matrix.host }}".config.system.build.toplevel' --no-link
