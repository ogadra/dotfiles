name: Build
on:
  pull_request:
    paths:
      - "**/*.nix"
      - "**/*.patch"
      - flake.lock
      - .github/workflows/build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: bisharp
            os: ubuntu-latest
            cfg: nixosConfigurations
          - host: xurkitree
            os: ubuntu-latest
            cfg: nixosConfigurations
          - host: xurkitree-isucon
            os: ubuntu-latest
            cfg: nixosConfigurations
          - host: stakataka
            os: macos-latest
            cfg: darwinConfigurations
          - host: wormadam
            os: macos-latest
            cfg: darwinConfigurations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ogadra-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - env:
          ATTR: ${{ matrix.cfg }}."${{ matrix.host }}".config.system.build.toplevel
        run: |
          # Up to 3 retries waiting 30s, 60s, then 120s; only network failures retry, since a build error would fail the same way again
          set -o pipefail
          for attempt in 0 1 2 3; do
            if nix build --print-out-paths ".#$ATTR" --no-link 2>&1 | tee build.log; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -q -E 'unable to download|curl error|networking issues' build.log; then
              exit 1
            fi
            sleep $(( 30 * 2 ** attempt ))
          done
