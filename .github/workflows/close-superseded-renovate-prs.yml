name: Close superseded Renovate PRs
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Merge freeze]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: close-superseded-renovate-prs
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15.2"
      - name: Close every Renovate PR that a newer ready one replaced
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project .github/scripts/close_superseded_renovate_prs.py
