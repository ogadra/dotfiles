name: Close superseded Renovate PRs
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 1-4 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: close-superseded-renovate-prs
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14.7"
      - name: Close every Renovate PR that a newer ready one replaced
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project .github/scripts/close_superseded_renovate_prs.py
