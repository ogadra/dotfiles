name: Lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15.2"
      - run: uv run --locked ruff format --check .github/scripts home-manager/common/modules/llm-agent/scripts/gh home-manager/common/cli/claude-code/scripts
      - run: uv run --locked ruff check .github/scripts home-manager/common/modules/llm-agent/scripts/gh home-manager/common/cli/claude-code/scripts
      - run: uv run --locked mypy
      - run: uv run --locked python -m unittest discover -s .github/scripts/tests -t .github/scripts
      - run: uv run --locked python -m unittest discover -s home-manager/common/modules/llm-agent/scripts/gh
      - run: uv run --locked python -m unittest discover -s home-manager/common/cli/claude-code/scripts
      - run: uv run --locked python .github/scripts/check_systems.py $(git ls-files "*.nix")
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix fmt -- --ci
